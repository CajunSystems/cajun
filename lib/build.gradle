/*
 * Backward-compatibility aggregator module.
 *
 * Publishes the original `com.cajunsystems:cajun` artifact, which now contains no
 * classes of its own and instead pulls in all Cajun modules transitively:
 *   cajun-core, cajun-mailbox, cajun-persistence, cajun-system, cajun-cluster
 *
 * Existing users of `com.cajunsystems:cajun` keep working unchanged. New projects
 * should depend on the individual modules they need (typically `cajun-system`,
 * plus `cajun-cluster` for distributed deployments).
 *
 * This module also hosts the integration/example test suite, which exercises the
 * whole system across module boundaries.
 */

plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).each {
    it.options.compilerArgs.add('--enable-preview')
}

dependencies {
    // Aggregate all Cajun modules so consumers of `com.cajunsystems:cajun`
    // see the same classes as before the modular split.
    api project(':cajun-core')
    api project(':cajun-mailbox')
    api project(':cajun-persistence')
    api project(':cajun-system')
    api project(':cajun-cluster')

    // Preserved from the pre-split artifact: logging backend at runtime.
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.16'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    // Mockito for mocking in tests
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'

    // Test utilities
    testImplementation project(':test-utils')

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        implementation('ch.qos.logback:logback-core:1.5.16') {
            because 'fixes CVE-2025-11226, CVE-2024-12798, CVE-2024-12801'
        }
    }
}

application {
    mainClass = project.hasProperty('mainClass') ? project.getProperty('mainClass') : null
}

group = 'com.cajunsystems'
version = project.findProperty('cajunVersion') ?: '0.8.0'

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('-enable-preview', true)
    options.addStringOption('source', '21')
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += '--enable-preview'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    jvmArgs(['--enable-preview'])
    useJUnitPlatform {
        // By default, exclude performance tests
        excludeTags 'performance'
    }
}

// Create a separate task for performance tests
tasks.register('performanceTest', Test) {
    description = 'Runs performance tests.'
    group = 'verification'

    jvmArgs(['--enable-preview'])
    useJUnitPlatform {
        includeTags 'performance'
    }

    // Increase timeouts for performance tests
    systemProperty 'junit.jupiter.execution.timeout.default', '5m'

    // Optional: configure test logging
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
            groupId = 'com.cajunsystems'
            artifactId = 'cajun'

            pom {
                name.set('Cajun')
                description.set('A pluggable actor system written in Java leveraging modern features from JDK21+. Aggregator artifact: depends on all Cajun modules.')
                url.set('https://github.com/cajunsystems/cajun')

                licenses {
                    license {
                        name.set('MIT License')
                        url.set('https://opensource.org/licenses/MIT')
                    }
                }

                developers {
                    developer {
                        id.set('cajunsystems')
                        name.set('CajunSystems')
                        email.set('info@cajunsystems.io')
                    }
                }

                scm {
                    connection.set('scm:git:git://github.com/cajunsystems/cajun.git')
                    developerConnection.set('scm:git:ssh://github.com:cajunsystems/cajun.git')
                    url.set('https://github.com/cajunsystems/cajun')
                }
            }
        }
    }

    repositories {
        maven {
            name = 'CentralPortal'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

def hasSigningCredentials = project.hasProperty('signing.keyId') &&
        project.hasProperty('signing.password') &&
        project.hasProperty('signing.secretKeyRingFile')

signing {
    required {
        gradle.taskGraph.hasTask('publishMavenJavaPublicationToCentralPortalRepository') && hasSigningCredentials
    }

    if (hasSigningCredentials) {
        sign publishing.publications.mavenJava
    } else {
        logger.lifecycle("Signing disabled for ${project.path} - missing signing properties")
    }
}

// Task to run example classes from test directory
tasks.register('runExample', JavaExec) {
    description = 'Runs an example class from the test directory'
    group = 'application'

    classpath = sourceSets.test.runtimeClasspath
    jvmArgs = ['--enable-preview']

    if (project.hasProperty('exampleClass')) {
        mainClass = project.getProperty('exampleClass')
    }
}

// Task to create a bundle for Central Portal upload
tasks.register('createCentralBundle', Zip) {
    from layout.buildDirectory.dir('repo')
    archiveFileName = "cajun-${version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    dependsOn 'publishMavenJavaPublicationToCentralPortalRepository'
}
